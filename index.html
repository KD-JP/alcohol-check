<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>運行前点検記録簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1c3049;
    --navy-deep:#12202f;
    --paper:#eef1f0;
    --card:#ffffff;
    --line:#d7dcd9;
    --ink:#1c2b2a;
    --ink-soft:#5c6b69;
    --teal:#0f5c5b;
    --teal-deep:#0a4241;
    --amber:#e2962f;
    --amber-bg:#fdf1de;
    --good:#3f7d58;
    --good-bg:#e6f3ea;
    --bad:#c1443c;
    --bad-bg:#fbeae8;
    --lcd-bg:#0e1f16;
    --lcd-green:#5be08a;
    --lcd-red:#ff6b5e;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter','Zen Kaku Gothic New',sans-serif;-webkit-font-smoothing:antialiased;}
  .app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;}

  /* Header */
  header{background:linear-gradient(160deg,#f9d34c 0%,#f0a800 100%);color:#20220b;padding:22px 20px 18px;position:relative;overflow:hidden;}
  header::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,0.18);}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8a5f00;margin:0 0 6px;}
  h1{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:21px;margin:0 0 4px;letter-spacing:.01em;color:#20220b;}
  .subline{font-size:12.5px;color:#5c4a12;margin:0;}
  .today-chip{position:absolute;right:20px;top:24px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:#7a5900;}

  /* Tabs */
  nav.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
  nav.tabs button{flex:1;border:none;background:transparent;padding:13px 6px;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:13px;color:var(--ink-soft);cursor:pointer;border-bottom:3px solid transparent;transition:.15s;}
  nav.tabs button.active{color:var(--teal-deep);border-bottom-color:var(--teal);background:#f4f8f7;}
  nav.tabs button:hover{color:var(--teal-deep);}

  main{flex:1;padding:18px 16px 60px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;}
  .card h2{font-family:'Zen Kaku Gothic New',sans-serif;font-size:15px;margin:0 0 14px;color:var(--navy);display:flex;align-items:center;gap:8px;}
  .card h2 .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);display:inline-block;}

  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:0 0 5px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  .field{margin-bottom:12px;}
  input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:7px;font-size:14px;font-family:inherit;background:#fbfbfa;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
  textarea{resize:vertical;min-height:56px;}

  .method-group{display:flex;gap:8px;}
  .method-group button{flex:1;padding:9px;border:1px solid var(--line);border-radius:7px;background:#fbfbfa;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .method-group button.selected{background:var(--teal);border-color:var(--teal);color:#fff;}

  .value-row{display:flex;gap:8px;align-items:stretch;}
  .value-row input{flex:1;font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.04em;}
  .input-hint{font-size:11px;color:var(--ink-soft);margin-top:6px;}
  .cam-btn{white-space:nowrap;padding:0 14px;border-radius:7px;border:1px solid var(--teal);background:#fff;color:var(--teal-deep);font-weight:700;font-size:12.5px;cursor:pointer;}
  .cam-btn:hover{background:#eef7f6;}
  .cam-btn:disabled{opacity:.55;cursor:wait;}
  .cam-preview img{max-width:130px;border-radius:6px;margin-top:9px;border:1px solid var(--line);display:block;}
  .cam-status{font-size:11.5px;color:var(--ink-soft);margin-top:7px;line-height:1.5;}

  /* LCD readout */
  .lcd{background:var(--lcd-bg);border-radius:9px;padding:14px 16px;margin:4px 0 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:inset 0 0 0 1px #0000004d;}
  .lcd-value{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;letter-spacing:.02em;}
  .lcd-unit{font-family:'JetBrains Mono',monospace;font-size:11px;color:#7c9490;margin-left:6px;}
  .lcd-judgment{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;padding:5px 10px;border-radius:5px;letter-spacing:.05em;}
  .lcd.ok .lcd-value{color:var(--lcd-green);}
  .lcd.ok .lcd-judgment{background:#193b28;color:var(--lcd-green);}
  .lcd.ng .lcd-value{color:var(--lcd-red);}
  .lcd.ng .lcd-judgment{background:#3a1a16;color:var(--lcd-red);}

  /* Checklist */
  .checklist-item{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;border-bottom:1px solid #eef0ef;gap:10px;}
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item .label{font-size:13.5px;color:var(--ink);font-weight:500;}
  .toggle{display:flex;gap:6px;flex-shrink:0;}
  .toggle button{width:52px;padding:7px 0;border-radius:6px;border:1px solid var(--line);background:#fbfbfa;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink-soft);}
  .toggle button.good.on{background:var(--good-bg);border-color:var(--good);color:var(--good);}
  .toggle button.bad.on{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);}

  .summary-strip{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:8px;margin-top:14px;font-weight:700;font-size:13px;}
  .summary-strip.good{background:var(--good-bg);color:var(--good);}
  .summary-strip.bad{background:var(--bad-bg);color:var(--bad);}

  .btn-primary{width:100%;padding:13px;border:none;border-radius:8px;background:linear-gradient(160deg,#f9d34c 0%,#f0a800 100%);color:#20220b;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:14.5px;cursor:pointer;margin-top:6px;}
  .btn-primary:hover{background:linear-gradient(160deg,#f0a800 0%,#d99400 100%);}
  .btn-primary:disabled{background:#a7b3b1;cursor:not-allowed;}

  /* History */
  .filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .filter-bar select,.filter-bar input{flex:1;min-width:110px;padding:8px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff;}
  .rec{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .rec.bad{border-left-color:var(--bad);}
  .rec-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .rec-title{font-weight:700;font-size:13.5px;color:var(--navy);}
  .rec-badge{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:10px;white-space:nowrap;}
  .rec-badge.ok{background:var(--good-bg);color:var(--good);}
  .rec-badge.warn{background:var(--amber-bg);color:var(--amber);}
  .rec-badge.ng{background:var(--bad-bg);color:var(--bad);}
  .rec-meta{font-size:12px;color:var(--ink-soft);margin-top:5px;line-height:1.6;}
  .rec-actions{margin-top:8px;text-align:right;}
  .rec-actions button{border:none;background:none;color:#9aa5a3;font-size:11.5px;cursor:pointer;text-decoration:underline;}
  .rec-actions button:hover{color:var(--bad);}
  .empty{text-align:center;color:var(--ink-soft);font-size:13px;padding:40px 10px;}
  .export-btn{font-family:'JetBrains Mono',monospace;font-size:11px;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--ink-soft);cursor:pointer;float:right;margin-bottom:10px;}

  .notice{font-size:11px;color:var(--ink-soft);text-align:center;padding:14px 20px 26px;line-height:1.6;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy-deep);color:#fff;padding:10px 18px;border-radius:20px;font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="today-chip" id="todayChip"></div>
    <p class="eyebrow">DAILY SAFETY LOG</p>
    <h1>アルコールチェック・始業点検 記録簿</h1>
    <p class="subline">運転者の酒気帯び確認と車両の日常点検を記録します</p>
  </header>

  <nav class="tabs">
    <button data-tab="alcohol" class="active">アルコール<br>チェック</button>
    <button data-tab="inspection">始業点検</button>
    <button data-tab="history">記録履歴</button>
  </nav>

  <main id="main"></main>
  <p class="notice">このデータはこのアプリを開いた全員が閲覧・編集できる共有データとして保存されます。<br>チームの点呼記録として共有利用を想定しています。</p>
</div>
<div class="toast" id="toast"></div>

<script>
const ITEMS = [
  ["brake","ブレーキの効き具合"],
  ["tire","タイヤの空気圧・損傷・摩耗"],
  ["coolant","冷却水の量"],
  ["battery","バッテリー液量"],
  ["lamp","ランプ類の点灯・点滅"],
  ["engine","エンジンの掛かり具合・異音"],
  ["bodydamage","車体の損傷"],
  ["oilleak","オイル漏れ"],
];

let state = {
  tab: "alcohol",
  alcoholRecords: [],
  inspectionRecords: [],
  loaded: false,
  alcValue: "",
  alcDigits: "",
  camThumb: null,
  camStatus: "",
  inspItems: {},
  histType: "all",
  histDriver: "",
};
ITEMS.forEach(([k])=> state.inspItems[k] = "good");

function todayStr(){
  const d = new Date();
  return d.toLocaleDateString('ja-JP', {year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'});
}
function nowTime(){
  const d = new Date();
  return d.toTimeString().slice(0,5);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function preprocessImage(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = ()=>{
      let { width, height } = img;
      const longest = Math.max(width, height);
      const maxDim = 1600, minDim = 900;
      let scale = 1;
      if(longest > maxDim) scale = maxDim / longest;
      else if(longest < minDim) scale = minDim / longest;
      width = Math.round(width * scale);
      height = Math.round(height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      try{ ctx.filter = 'contrast(1.3) saturate(1.15) brightness(1.05)'; }catch(e){}
      ctx.drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
      URL.revokeObjectURL(objectUrl);
      resolve({ dataUrl, base64: dataUrl.split(',')[1], mediaType: 'image/jpeg' });
    };
    img.onerror = ()=>{ URL.revokeObjectURL(objectUrl); reject(new Error('image load failed')); };
    img.src = objectUrl;
  });
}

async function readAlcoholValueFromImage(base64, mediaType){
  const prompt = `この画像は呼気アルコール検知器（ブレスチェッカー）の表示画面です。表示されている測定値を正確に読み取ってください。

手順：
1. 画面の数字表示部分だけに注目し、単位表記・アイコン・機種名・ボタンなどは無視する。
2. 7セグメント表示の場合、1桁ずつどのセグメントが点灯しているかを確認して数字を特定する。
3. 小数点の位置を正確に確認する（例: 0.00 と 0.15 を混同しない）。
4. 反射や不鮮明さで読みにくい場合は、最も可能性の高い値を推定し、その旨をconfidenceに反映する。

確認が終わったら、最後に必ず次の形式のJSONを1行で出力してください（その前に手順の確認を書いてよい）。
{"value": 0.00, "confidence": "high"}
confidenceは "high"（はっきり読み取れた）か "low"（不鮮明で推定が入った）のいずれか。数値が全く判読できない場合は {"value": null, "confidence": "low"} としてください。`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 500,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
          { type: "text", text: prompt }
        ]
      }]
    })
  });
  const data = await response.json();
  const textBlock = (data.content || []).find(b => b.type === 'text');
  if(!textBlock) throw new Error('no text in response');
  const match = textBlock.text.match(/\{[^{}]*"value"[^{}]*\}/);
  if(!match) throw new Error('no json found in response');
  const parsed = JSON.parse(match[0]);
  if(parsed.value === null || parsed.value === undefined || isNaN(parseFloat(parsed.value))){
    return { value: null, confidence: parsed.confidence || 'low' };
  }
  return { value: parseFloat(parsed.value), confidence: parsed.confidence === 'low' ? 'low' : 'high' };
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

async function loadData(){
  try{
    const a = await window.storage.get('alcohol-records', true);
    state.alcoholRecords = a ? JSON.parse(a.value) : [];
  }catch(e){ state.alcoholRecords = []; }
  try{
    const i = await window.storage.get('inspection-records', true);
    state.inspectionRecords = i ? JSON.parse(i.value) : [];
  }catch(e){ state.inspectionRecords = []; }
  state.loaded = true;
  render();
}

async function saveAlcohol(){
  try{
    await window.storage.set('alcohol-records', JSON.stringify(state.alcoholRecords), true);
  }catch(e){ showToast('保存に失敗しました'); }
}
async function saveInspection(){
  try{
    await window.storage.set('inspection-records', JSON.stringify(state.inspectionRecords), true);
  }catch(e){ showToast('保存に失敗しました'); }
}

function alcJudgment(v){
  const val = parseFloat(v);
  if(isNaN(val) || val<=0) return {label:"OK", tier:"ok"};
  if(val < 0.15) return {label:"要注意", tier:"warn"};
  return {label:"NG（酒気帯び）", tier:"ng"};
}

function renderAlcoholTab(){
  const j = state.alcValue !== "" ? alcJudgment(state.alcValue) : null;
  const recent = state.alcoholRecords.slice().reverse().slice(0,4);
  return `
  <div class="card">
    <h2><span class="dot"></span>アルコールチェック</h2>
    <div class="row">
      <div class="field"><label>日付</label><input type="date" id="f_date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>時刻</label><input type="time" id="f_time" value="${nowTime()}"></div>
    </div>
    <div class="field"><label>運転者氏名</label><input type="text" id="f_driver" placeholder="山田 太郎"></div>
    <div class="field">
      <label>測定値（mg/L）</label>
      <div class="value-row">
        <input type="text" inputmode="numeric" pattern="[0-9]*" id="f_value" placeholder="015" value="${state.alcDigits}">
        <button type="button" id="camBtn" class="cam-btn">📷 カメラで読取</button>
      </div>
      <div class="input-hint">数字を入力すると自動で小数点2桁になります（例: 015 → 0.15 mg/L）</div>
      <input type="file" accept="image/*" capture="environment" id="camInput" style="display:none;">
      ${state.camThumb? `<div class="cam-preview"><img src="${state.camThumb}" alt="撮影画像"></div>` : ''}
      ${state.camStatus? `<div class="cam-status">${esc(state.camStatus)}</div>` : ''}
    </div>
    <div class="lcd ${j? (j.tier==='ok'?'ok':'ng'):'ok'}">
      <div><span class="lcd-value">${state.alcValue!==""?parseFloat(state.alcValue).toFixed(2):"0.00"}</span><span class="lcd-unit">mg/L</span></div>
      <div class="lcd-judgment">${j? j.label : "未測定"}</div>
    </div>
    <div class="field"><label>業務以外で使用する用途を記入</label><input type="text" id="f_dest" placeholder=""></div>
    <div class="field"><label>備考（任意）</label><textarea id="f_notes"></textarea></div>
    <button class="btn-primary" id="saveAlcohol">この内容で記録する</button>
  </div>
  <div class="card">
    <h2><span class="dot" style="background:var(--amber)"></span>直近の記録</h2>
    ${recent.length? recent.map(recAlcoholCard).join('') : '<p class="empty">まだ記録がありません</p>'}
  </div>`;
}

function recAlcoholCard(r){
  const j = alcJudgment(r.value);
  const badgeClass = j.tier==='ok'?'ok':(j.tier==='warn'?'warn':'ng');
  return `<div class="rec ${j.tier!=='ok'?'bad':''}">
    <div class="rec-top">
      <div class="rec-title">${esc(r.driver)||'（氏名未入力）'}</div>
      <div class="rec-badge ${badgeClass}">${j.label}</div>
    </div>
    <div class="rec-meta">${r.date} ${r.time} ・ 測定値 ${parseFloat(r.value).toFixed(2)}mg/L</div>
    <div class="rec-actions"><button data-del-alc="${r.id}">削除</button></div>
  </div>`;
}

function renderInspectionTab(){
  const anyBad = Object.values(state.inspItems).some(v=>v==='bad');
  const recent = state.inspectionRecords.slice().reverse().slice(0,3);
  return `
  <div class="card">
    <h2><span class="dot"></span>始業点検</h2>
    <div class="row">
      <div class="field"><label>日付</label><input type="date" id="i_date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>点検者氏名</label><input type="text" id="i_inspector" placeholder="点検者名"></div>
    </div>
    <div class="field"><label>車両番号</label><input type="text" id="i_vehicle" placeholder="品川300 あ12-34"></div>
    <div class="field" style="margin-top:6px;">
      <label>点検項目（異常があるものは「否」を選択）</label>
      <div id="checklist">
        ${ITEMS.map(([k,label])=>`
          <div class="checklist-item">
            <div class="label">${label}</div>
            <div class="toggle">
              <button type="button" class="good ${state.inspItems[k]==='good'?'on':''}" data-item="${k}" data-val="good">良</button>
              <button type="button" class="bad ${state.inspItems[k]==='bad'?'on':''}" data-item="${k}" data-val="bad">否</button>
            </div>
          </div>`).join('')}
      </div>
      <div class="summary-strip ${anyBad?'bad':'good'}">
        <span>総合判定</span><span>${anyBad? '要整備・使用不可の可能性あり' : '良好・運行可'}</span>
      </div>
    </div>
    <div class="field" style="margin-top:14px;"><label>備考（異常内容など）</label><textarea id="i_notes"></textarea></div>
    <button class="btn-primary" id="saveInspection">この内容で記録する</button>
  </div>
  <div class="card">
    <h2><span class="dot" style="background:var(--amber)"></span>直近の記録</h2>
    ${recent.length? recent.map(recInspectionCard).join('') : '<p class="empty">まだ記録がありません</p>'}
  </div>`;
}

function recInspectionCard(r){
  const bad = Object.values(r.items).some(v=>v==='bad');
  const badItems = ITEMS.filter(([k])=>r.items[k]==='bad').map(([,l])=>l);
  return `<div class="rec ${bad?'bad':''}">
    <div class="rec-top">
      <div class="rec-title">${esc(r.vehicle)||'（車両番号未入力）'}</div>
      <div class="rec-badge ${bad?'ng':'ok'}">${bad?'要整備':'良好'}</div>
    </div>
    <div class="rec-meta">${r.date} ・ 点検者：${esc(r.inspector)||'-'}${bad? '<br>異常項目：'+esc(badItems.join('、')) : ''}</div>
    <div class="rec-actions"><button data-del-insp="${r.id}">削除</button></div>
  </div>`;
}

function renderHistoryTab(){
  let all = [
    ...state.alcoholRecords.map(r=>({...r, _type:'alcohol'})),
    ...state.inspectionRecords.map(r=>({...r, _type:'inspection'}))
  ];
  all.sort((a,b)=> (b.date+((b.time)||'')).localeCompare(a.date+((a.time)||'')) || (b.createdAt-a.createdAt));

  if(state.histType !== 'all') all = all.filter(r=>r._type===state.histType);
  if(state.histDriver.trim()){
    const q = state.histDriver.trim();
    all = all.filter(r => (r.driver||r.inspector||'').includes(q));
  }

  return `
  <div class="card">
    <h2><span class="dot"></span>記録履歴</h2>
    <div class="filter-bar">
      <select id="h_type">
        <option value="all" ${state.histType==='all'?'selected':''}>すべて</option>
        <option value="alcohol" ${state.histType==='alcohol'?'selected':''}>アルコールチェック</option>
        <option value="inspection" ${state.histType==='inspection'?'selected':''}>始業点検</option>
      </select>
      <input type="text" id="h_driver" placeholder="氏名で絞り込み" value="${esc(state.histDriver)}">
    </div>
    <button class="export-btn" id="exportCsv">CSVエクスポート</button>
    <div style="clear:both"></div>
    ${all.length? all.map(r=> r._type==='alcohol'? recAlcoholCard(r) : recInspectionCard(r)).join('') : '<p class="empty">条件に一致する記録がありません</p>'}
  </div>`;
}

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  document.getElementById('todayChip').textContent = todayStr();
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === state.tab);
  });
  const main = document.getElementById('main');
  if(!state.loaded){ main.innerHTML = '<p class="empty">読み込み中...</p>'; return; }
  if(state.tab==='alcohol') main.innerHTML = renderAlcoholTab();
  else if(state.tab==='inspection') main.innerHTML = renderInspectionTab();
  else main.innerHTML = renderHistoryTab();
  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.onclick = ()=>{ state.tab = b.dataset.tab; render(); };
  });

  if(state.tab==='alcohol'){
    const valInput = document.getElementById('f_value');
    valInput.oninput = ()=>{
      const digits = valInput.value.replace(/\D/g, '').slice(0, 4);
      state.alcDigits = digits;
      state.alcValue = digits === "" ? "" : (parseInt(digits, 10) / 100).toFixed(2);
      render();
      const el = document.getElementById('f_value');
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    };

    document.getElementById('camBtn').onclick = ()=> document.getElementById('camInput').click();
    document.getElementById('camInput').onchange = async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      state.camStatus = '画像を処理中...';
      render();
      try{
        const { dataUrl, base64, mediaType } = await preprocessImage(file);
        state.camThumb = dataUrl;
        state.camStatus = '画像を解析中...';
        render();
        const result = await readAlcoholValueFromImage(base64, mediaType);
        if(result.value === null){
          state.camStatus = '数値を読み取れませんでした。手動で入力してください。';
        }else{
          state.alcValue = result.value.toFixed(2);
          state.alcDigits = Math.round(result.value * 100).toString();
          state.camStatus = result.confidence === 'low'
            ? `読み取り値：${result.value.toFixed(2)} mg/L（不鮮明な可能性あり・必ず確認してください）`
            : `読み取り値：${result.value.toFixed(2)} mg/L（内容を確認してください）`;
        }
      }catch(err){
        state.camStatus = '読み取りに失敗しました。手動で入力してください。';
      }
      render();
    };
    document.getElementById('saveAlcohol').onclick = async ()=>{
      const driver = document.getElementById('f_driver').value.trim();
      if(!driver){ showToast('運転者氏名を入力してください'); return; }
      const rec = {
        id: uid(),
        date: document.getElementById('f_date').value,
        time: document.getElementById('f_time').value,
        driver,
        value: state.alcValue || "0",
        destination: document.getElementById('f_dest').value.trim(),
        notes: document.getElementById('f_notes').value.trim(),
        createdAt: Date.now(),
      };
      state.alcoholRecords.push(rec);
      await saveAlcohol();
      state.alcValue = "";
      state.alcDigits = "";
      state.camThumb = null;
      state.camStatus = "";
      showToast('記録を保存しました');
      render();
    };
    document.querySelectorAll('[data-del-alc]').forEach(b=>{
      b.onclick = async ()=>{
        state.alcoholRecords = state.alcoholRecords.filter(r=>r.id!==b.dataset.delAlc);
        await saveAlcohol();
        render();
      };
    });
  }

  if(state.tab==='inspection'){
    document.querySelectorAll('#checklist .toggle button').forEach(b=>{
      b.onclick = ()=>{ state.inspItems[b.dataset.item] = b.dataset.val; render(); };
    });
    document.getElementById('saveInspection').onclick = async ()=>{
      const vehicle = document.getElementById('i_vehicle').value.trim();
      const inspector = document.getElementById('i_inspector').value.trim();
      if(!vehicle){ showToast('車両番号を入力してください'); return; }
      const rec = {
        id: uid(),
        date: document.getElementById('i_date').value,
        inspector, vehicle,
        items: {...state.inspItems},
        notes: document.getElementById('i_notes').value.trim(),
        createdAt: Date.now(),
      };
      state.inspectionRecords.push(rec);
      await saveInspection();
      ITEMS.forEach(([k])=> state.inspItems[k]='good');
      showToast('記録を保存しました');
      render();
    };
    document.querySelectorAll('[data-del-insp]').forEach(b=>{
      b.onclick = async ()=>{
        state.inspectionRecords = state.inspectionRecords.filter(r=>r.id!==b.dataset.delInsp);
        await saveInspection();
        render();
      };
    });
  }

  if(state.tab==='history'){
    document.getElementById('h_type').onchange = (e)=>{ state.histType = e.target.value; render(); };
    document.getElementById('h_driver').oninput = (e)=>{ state.histDriver = e.target.value; render(); };
    document.querySelectorAll('[data-del-alc]').forEach(b=>{
      b.onclick = async ()=>{
        state.alcoholRecords = state.alcoholRecords.filter(r=>r.id!==b.dataset.delAlc);
        await saveAlcohol(); render();
      };
    });
    document.querySelectorAll('[data-del-insp]').forEach(b=>{
      b.onclick = async ()=>{
        state.inspectionRecords = state.inspectionRecords.filter(r=>r.id!==b.dataset.delInsp);
        await saveInspection(); render();
      };
    });
    document.getElementById('exportCsv').onclick = ()=>{
      const rows = [["種別","日付","時刻","氏名","車両番号","判定/測定値","備考"]];
      state.alcoholRecords.forEach(r=>{
        const j = alcJudgment(r.value);
        rows.push(["アルコールチェック", r.date, r.time, r.driver, "", `${r.value}mg/L (${j.label})`, r.notes||""]);
      });
      state.inspectionRecords.forEach(r=>{
        const bad = Object.values(r.items).some(v=>v==='bad');
        rows.push(["始業点検", r.date, "", r.inspector, r.vehicle, bad?"要整備":"良好", r.notes||""]);
      });
      const csv = rows.map(row=>row.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
      const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `safety-log_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    };
  }
}

loadData();
</script>
</body>
</html>
